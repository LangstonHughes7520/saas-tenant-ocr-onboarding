[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-tenant-ocr-onboarding"
version = "0.1.0"
description = "OCR tenant onboarding PDFs and turn searchable text into an account lifecycle decision."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["tenant_onboarding", "infrai_pdf", "onboarding_policy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
